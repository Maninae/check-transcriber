<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found · Check Transcriber</title>
<!-- GitHub Pages serves this file at whatever wrong path was asked for (/check-transcriber/a/b),
     so every URL here is rooted at /check-transcriber/ instead of relative. No scripts at all;

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none';" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#edeef8" />
<link rel="icon" type="image/svg+xml" href="/check-transcriber/favicon.svg" />
<link rel="icon" sizes="32x32" href="/check-transcriber/favicon.ico" />
<link rel="apple-touch-icon" href="/check-transcriber/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="/check-transcriber/styles/base.css" />
<link rel="stylesheet" href="/check-transcriber/styles/not-found.css" />
</head>
<body>
<main class="not-found">
  <img class="not-found-icon" src="/check-transcriber/favicon.svg" alt="" />
  <h1 class="not-found-heading">This page isn't here.</h1>
  <p class="not-found-note">The link may be mistyped or out of date.</p>
  <a class="primary-button not-found-link" href="/check-transcriber/">Open Check Transcriber →</a>
</main>
</body>
</html>
